services:
  postgres:
    image: postgres:16-alpine
    container_name: janamen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: janamen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janamen-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/janamen?sslmode=disable"
      JWT_SECRET: "janamen-hackathon-secure-secret-key-2026"
      CORS_ORIGINS: "http://localhost:4200,http://localhost:80,http://localhost,https://kilcdevs.net"
      AUTO_SEED: "true"
      PASSWORD_HR: "${PASSWORD_HR:-MiRaS278v}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: janamen-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
