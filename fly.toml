# fly.toml app configuration file generated for janamen-backend on 2026-10-18T14:37:19+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'janamen-backend'
primary_region = 'arn'

[build]
  dockerfile = './backend/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
